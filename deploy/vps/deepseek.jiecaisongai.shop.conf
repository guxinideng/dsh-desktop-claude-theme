# /etc/nginx/conf.d/deepseek.jiecaisongai.shop.conf — dsh mobile gateway vhost
# 提取 dsh 网关认证标识(Cookie 或 Bearer), 用于 HTML 缓存 key 区分认证状态
# 未认证请求(无 cookie 无 bearer)key 为空, 不会命中已认证的缓存 -> 仍返回 401
map $http_cookie $dsh_auth_cookie {
    ~*dsh_gateway_token=([a-f0-9]+) $1;
    default "";
}
map $http_authorization $dsh_auth_bearer {
    ~*^Bearer\s+([a-f0-9]+) $1;
    default "";
}

# dsh gateway 上游 = SSH 反向隧道 (127.0.0.1:8443 -> Mac gateway 3090 -> dsh 3080)
upstream dsh_gateway {
    server 127.0.0.1:8443;
    keepalive 16;
    keepalive_timeout 60s;
}

# WebSocket 升级 + 普通请求复用上游连接
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name deepseek.jiecaisongai.shop;

    root /var/www/certbot;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:4445 ssl;
    server_name deepseek.jiecaisongai.shop;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/deepseek.jiecaisongai.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deepseek.jiecaisongai.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:DSH_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_early_data on;
    ssl_ecdh_curve X25519:prime256v1;

    # dsh 静态构建资产: 文件名带内容 hash, 永不变化, 手机二次打开直接 VPS 命中, 不再走隧道
    location ~ ^/assets/ {
        proxy_pass http://dsh_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache dsh_cache;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_502;
        add_header X-Cache $upstream_cache_status always;
        proxy_ignore_headers Set-Cookie;
        expires 30d;
        access_log off;
    }

    location = /favicon.svg {
        proxy_pass http://dsh_gateway;
        proxy_cache dsh_cache;
        proxy_cache_valid 200 7d;
        add_header X-Cache $upstream_cache_status always;
        expires 7d;
        access_log off;
    }

    # gateway 注入的主题资源 (theme.css/mobile.css/mobile.js): URL 固定, 缓存 1h
    # 用户改主题后 1h 内手机端可能看不到最新样式(可接受); 想立即生效可清 VPS 缓存
    location ~ ^/__ds_theme/ {
        proxy_pass http://dsh_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache dsh_cache;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        # 上游(remote-gateway.js)写死 cache-control: no-cache -> nginx 拒绝缓存.
        # 强制忽略上游缓存头, 按 proxy_cache_valid 缓存; 隐藏上游头, 给浏览器换成可缓存的
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    location = /manifest.webmanifest {
        proxy_pass http://dsh_gateway;
        proxy_cache dsh_cache;
        proxy_cache_valid 200 1h;
        add_header X-Cache $upstream_cache_status always;
        expires 1h;
        access_log off;
    }
    location = / {
        proxy_redirect off;
        proxy_pass http://dsh_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_socket_keepalive on;
        # 首页 HTML 缓存 60s (上游 no-store 被忽略; 带 Set-Cookie 的 token 初始化响应不缓存)
        proxy_cache dsh_cache;
        proxy_cache_key $scheme$host$request_uri$dsh_auth_cookie$dsh_auth_bearer;
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "max-age=60, must-revalidate" always;
        add_header X-Cache $upstream_cache_status always;
        add_header Link "</assets/index-CSGf6Qzd.css>; rel=preload; as=style, </assets/index-Dqw48FrP.js>; rel=preload; as=script, </assets/vendor-Cjbwl5VI.js>; rel=preload; as=script, </assets/vendor-CjyC-hUb.css>; rel=preload; as=style, </__ds_theme/theme.css>; rel=preload; as=style, </__ds_theme/mobile.css>; rel=preload; as=style, </__ds_theme/mobile.js>; rel=preload; as=script" always;
        access_log off;
    }

    location / {
        # CF orange-cloud compat: never cache HTML, only /assets
        # HTML 短缓存: 浏览器 60s 内二次打开直接用本地(对话数据是 API 拉的, 不在 HTML 里, 无副作用)
        # 注意: 带 Set-Cookie 的响应 nginx 默认不缓存, token 设置流程不受影响
        add_header Cache-Control "max-age=60, must-revalidate" always;
        # 首屏加速: 提示浏览器并行下载 4 个核心静态文件(共享同一条 HTTP/2 连接)
        add_header Link "</assets/index-CSGf6Qzd.css>; rel=preload; as=style, </assets/index-Dqw48FrP.js>; rel=preload; as=script, </assets/vendor-Cjbwl5VI.js>; rel=preload; as=script, </assets/vendor-CjyC-hUb.css>; rel=preload; as=style, </__ds_theme/theme.css>; rel=preload; as=style, </__ds_theme/mobile.css>; rel=preload; as=style, </__ds_theme/mobile.js>; rel=preload; as=script" always;
        proxy_redirect off;
        proxy_pass http://dsh_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        access_log off;
    }
}
