# /etc/nginx/stream-conf.d/sni-443.conf — SNI 分流 (443 -> 各后端)
map $ssl_preread_server_name $sni_443_backend {
    go.jiecaisongai.shop nginx_go_https;
    deepseek.jiecaisongai.shop nginx_deepseek_https;
    default xray_reality_443;
}

upstream nginx_go_https {
    server 127.0.0.1:4443;
}

upstream nginx_deepseek_https {
    server 127.0.0.1:4445;
}

upstream xray_reality_443 {
    server 127.0.0.1:24443;
}

server {
    listen 443;
    listen [::]:443;
    proxy_pass $sni_443_backend;
    ssl_preread on;
}
